<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMH Lab Tracker</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <!-- App Header -->
  <header class="app-header">
    <div class="brand-container">
      <img id="header-logo" src="/assets/branding/logo.png" alt="Logo" class="brand-logo">
      <div class="brand-titles">
        <h1 id="app-title">AMH Lab Tracker</h1>
        <p id="facility-name">Ahmadiyya Muslim Hospital, Mbale</p>
      </div>
    </div>
    <div class="user-nav" id="user-nav">
      <!-- User profile & Logout populated by app.js -->
    </div>
  </header>

  <!-- Navigation Bar -->
  <nav class="app-nav" id="app-nav" style="display: none;">
    <button class="nav-tab active" onclick="app.navigate('daily-log')"><svg class="lucide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg> Daily Log</button>
    <button class="nav-tab" onclick="app.navigate('reports')"><svg class="lucide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg> Reports</button>
    <button class="nav-tab" onclick="app.navigate('trends')"><svg class="lucide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg> Trends</button>
    <button class="nav-tab" onclick="app.navigate('clients')"><svg class="lucide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg> Test Reports</button>
    <button class="nav-tab admin-only" onclick="app.navigate('config')"><svg class="lucide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg> Configuration</button>
    <button class="nav-tab admin-only" onclick="app.navigate('audit')"><svg class="lucide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg> Audit Log</button>
  </nav>

  <!-- Main View Container -->
  <main class="main-container" id="view-container">
    <!-- View content dynamically rendered by app.js -->
  </main>

  <!-- Login Modal -->
  <div class="modal-overlay" id="login-modal" style="display: none;">
    <div class="modal-content">
      <!-- Login Container -->
      <div id="login-form-container">
        <div style="text-align: center; margin-bottom: 20px;">
          <h2 style="color: var(--primary-color);">Lab Staff Login</h2>
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">Sign in to access the AMH Lab Tracker</p>
        </div>
        <form id="login-form" onsubmit="app.handleLogin(event)">
          <div class="form-group" style="margin-bottom: 16px;">
            <label for="login-username">Username</label>
            <input type="text" id="login-username" required placeholder="Enter username">
          </div>
          <div class="form-group" style="margin-bottom: 24px;">
            <label for="login-password">Password</label>
            <div style="position: relative; display: flex; align-items: center; width: 100%;">
              <input type="password" id="login-password" required placeholder="Enter password" style="padding-right: 40px; width: 100%;">
              <button type="button" onclick="app.togglePasswordVisibility('login-password')" style="position: absolute; right: 12px; background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 0; display: flex; align-items: center;">
                <svg class="lucide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <div id="login-error" style="color: var(--danger-color); font-size: 0.85rem; margin-bottom: 16px; display: none;"></div>
          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px;">Sign In</button>
          <p style="text-align: center; font-size: 0.85rem; margin-top: 16px; color: var(--text-muted);">
            New user? <a href="#" onclick="app.showRegisterForm(event)" style="color: var(--primary-color); font-weight: 600; text-decoration: none;">Register here</a>
          </p>
        </form>
      </div>

      <!-- Register Container (hidden by default) -->
      <div id="register-form-container" style="display: none;">
        <div style="text-align: center; margin-bottom: 20px;">
          <h2 style="color: var(--primary-color);">Create Account</h2>
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">Register a new Lab staff profile</p>
        </div>
        <form id="register-form" onsubmit="app.handleRegister(event)">
          <div class="form-group" style="margin-bottom: 16px;">
            <label for="register-fullname">Full Name</label>
            <input type="text" id="register-fullname" required placeholder="Enter full name">
          </div>
          <div class="form-group" style="margin-bottom: 16px;">
            <label for="register-username">Username</label>
            <input type="text" id="register-username" required placeholder="Enter username">
          </div>
          <div class="form-group" style="margin-bottom: 24px;">
            <label for="register-password">Password</label>
            <div style="position: relative; display: flex; align-items: center; width: 100%;">
              <input type="password" id="register-password" required placeholder="Enter password" style="padding-right: 40px; width: 100%;">
              <button type="button" onclick="app.togglePasswordVisibility('register-password')" style="position: absolute; right: 12px; background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 0; display: flex; align-items: center;">
                <svg class="lucide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <div id="register-error" style="color: var(--danger-color); font-size: 0.85rem; margin-bottom: 16px; display: none;"></div>
          <div id="register-success" style="color: var(--success-color); font-size: 0.85rem; margin-bottom: 16px; display: none;"></div>
          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px;">Register</button>
          <p style="text-align: center; font-size: 0.85rem; margin-top: 16px; color: var(--text-muted);">
            Already have an account? <a href="#" onclick="app.showLoginForm(event)" style="color: var(--primary-color); font-weight: 600; text-decoration: none;">Sign in here</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <!-- App Footer -->
  <footer class="app-footer">
    <span id="footer-text">Ahmadiyya Muslim Hospital — Laboratory Department, Mbale, Uganda</span>
  </footer>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <script src="/static/js/app.js"></script>
</body>
</html>
